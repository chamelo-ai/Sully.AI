name: Transcript Quality Test

on:
  push:
    branches: [ test ]  # Trigger on every commit to the test branch

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Change to QA directory and install dependencies
        run: |
          cd QA
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run transcript quality test
        run: npx playwright test Transcriptscore.spec.js

      # Optionally upload artifacts on failure
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: transcript-test-results
          path: |
            results/
            test-results/
            playwright-report/
          retention-days: 7
