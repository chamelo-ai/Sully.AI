name: Transcript Quality Test

on:
  push:
    branches: [ test ]  # or [ dev, test ] as needed

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Google Cloud credentials
        run: echo "${{ secrets.GOOGLE_API_KEY }}" > audiotesting.json

      - name: Set up OpenAI API key
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env

      - name: Run transcript quality test
        run: npx playwright test 2_tests/Transcriptscore.spec.js

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v3.1.2

        with:
          name: quality-test-results
          path: |
            results/
            test-results/
            playwright-report/
          retention-days: 7

permissions:
  contents: read